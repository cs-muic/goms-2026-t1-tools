[package]
name = "mrc-check"
version = "0.1.0"
edition = "2021"
description = "Black-box correctness checker for Mini 3 (Micro-Redis Cluster)"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
